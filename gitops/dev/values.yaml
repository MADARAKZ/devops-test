image:
  repository: localhost:5000/devops-demo-app
  tag: dev-8-c7499be
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  enabled: true
  data:
    NODE_ENV: development
    PORT: "8080"
    APP_ENV: dev

deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false

service:
  nodePort: 30080
