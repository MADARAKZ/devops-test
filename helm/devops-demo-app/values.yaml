nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

replicaCount: 2
revisionHistoryLimit: 5

image:
  repository: devops-demo-app
  tag: minikube
  pullPolicy: IfNotPresent

imagePullSecrets: []

app:
  port: 8080

config:
  enabled: true
  data:
    NODE_ENV: production
    PORT: "8080"

env: []
envFrom: []

command: []
args: []

deployment:
  annotations: {}
  labels: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  annotations: {}
  port: 80
  targetPort: 8080
  nodePort: 30080
  protocol: TCP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: devops-demo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    path: /
    port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []
